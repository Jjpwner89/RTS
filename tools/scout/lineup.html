function codeTrees() {

  for (const mesh of grp.children) {
    const m = new THREE.Matrix4(), p = new THREE.Vector3(), qq = new THREE.Quaternion(), s = new THREE.Vector3();

  }
  // keep one instance per kind, side by side
  grp.children.forEach((mesh, j) => { mesh.count = Math.min(1, mesh.count); mesh.position.x = j * 6; });
  g.add(grp); return g;
}
