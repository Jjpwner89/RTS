<!doctype html>
<meta charset="utf-8">
<title>Day shots</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style>
<iframe id="f"></iframe>
<script type="module">
// Shots of a page at given times of day (look.js), in a headless Chrome, optionally with checks() at each:
//   PAGE=dayshots.html sh tools/perf/runprof.sh 'test=lord&at=world:30,world:105,town:105&checks=1'
//   PAGE=dayshots.html sh tools/perf/runprof.sh 'page=battle.html&at=here:30,here:105&checks=1'
// page: the page to load (default world.html?test=<test>); at: view:seconds, where view is world or town (the
// campaign goes there first) or here; each stops the clock at that many seconds, waits, and PUTs a jpg to the
// shot sink. width=527 narrows the page and reports whether the top bar fits. Posts each result, then done.
const P = new URLSearchParams(location.search);
const SINK = P.get('sink') || 8733, SHOTS = P.get('shotport') || 8732;
const post = o => fetch(`http://127.0.0.1:${SINK}/prof.json`, { method: 'POST', body: JSON.stringify(o) });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById('f');
if (P.get('width')) f.style.width = P.get('width') + 'px';
f.src = '../../' + (P.get('page') || `world.html?test=${P.get('test') || 'lord'}`);
try {
  await new Promise(r => f.onload = r);
  const w = f.contentWindow, errs = [];
  w.addEventListener('error', e => errs.push(e.message));
  w.addEventListener('unhandledrejection', e => errs.push(String(e.reason)));
  for (let i = 0; i < 120 && !(w.game && w.checks); i++) await sleep(250);
  const G = w.game;
  await sleep(2500);
  for (const shot of (P.get('at') || 'world:105').split(',')) {
    const [view, t] = shot.split(':');
    if (view === 'town' && G.mode !== 'town') { G.enterTown(G.world.pois.find(p => p.town && p.owner === 0) || G.world.pois.find(p => p.town)); await sleep(3000); }
    if (view === 'world' && G.mode !== 'world') { G.showWorld(); await sleep(2000); }
    w.look.look.clock = () => +t;
    await sleep(1500);
    // notorch=1: no glows (lamps, torches), to compare
    if (P.get('notorch')) (G.stage || w.stage).current().traverse(o => { if (o.isPoints) o.material.visible = false; });
    const st = G.stage || w.stage;
    if (st) {
      const cv = st.renderer.domElement;
      // draw a frame and copy it at once, before the browser clears it
      st.renderer.render(st.current(), st.camera); const c2 = document.createElement('canvas'); c2.width = 1024; c2.height = Math.round(1024 * cv.height / cv.width);
      c2.getContext('2d').drawImage(cv, 0, 0, c2.width, c2.height);
      const blob = await new Promise(res => c2.toBlob(res, 'image/jpeg', 0.88));
      await fetch(`http://127.0.0.1:${SHOTS}/day-${view}-${t}${P.get('width') ? '-w' + P.get('width') : ''}${P.get('notorch') ? '-dark' : ''}.jpg`, { method: 'PUT', body: blob });
    }
    const out = { shot, night: w.look.NIGHT.value, dial: w.document.getElementById('daydial')?.textContent };
    // hide=sel: leave something out of the page first, to compare (hide=%23daydial)
    if (P.get('hide')) for (const e of w.document.querySelectorAll(P.get('hide'))) e.style.display = 'none';
    const top = w.document.getElementById('top');
    if (top) {
      const r = top.getBoundingClientRect(), kids = [...top.children].filter(k => k.offsetParent);
      out.top = { width: Math.round(r.width), height: Math.round(r.height), scroll: top.scrollWidth, client: top.clientWidth, page: w.innerWidth,
        outside: kids.filter(k => { const b = k.getBoundingClientRect(); return b.right > w.innerWidth + 0.5 || b.left < -0.5; }).map(k => k.id || k.className),
        rows: new Set(kids.map(k => Math.round(k.getBoundingClientRect().top))).size,
        line: kids.map(k => `${k.id || k.className}@${Math.round(k.getBoundingClientRect().top)}`).join(' ') };
    }
    if (P.get('checks')) { const c = await w.checks({ quiet: true }); out.checks = `${c.pass} pass, ${c.fail} fail, ${c.warn} warn`; out.failed = c.results.filter(r => r.status !== 'pass' && r.status !== 'skip').map(r => `${r.status} ${r.group}: ${r.name} ${(r.detail || []).slice(0, 2).join(' | ')}`); }
    await post(out);
  }
  await post({ done: true, errs });
} catch (e) { await post({ error: String(e.stack || e) }); }
</script>
