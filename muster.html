<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTS Muster</title>
<link rel="stylesheet" href="src/style.css">
<link rel="stylesheet" href="src/skin.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  body { overflow: hidden; }
  /* The game's parchment and ink (skin.css tokens): a leather bar on top, parchment panels beside the field. */
  #muster-top { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: min(980px, calc(100vw - 24px)); display: flex; gap: 8px; align-items: center; padding: 6px 12px; z-index: 3;
    background: var(--bar-surface); border: var(--bar-border); border-radius: var(--surface-radius); box-shadow: var(--bar-shadow); color: var(--bar-ink); }
  #muster-top .title { font: 400 18px var(--head-font); letter-spacing: .02em; margin-right: auto; }
  #muster-top a, #muster-top button { font: 500 14px var(--body-font); color: var(--btn-ink); background: var(--btn); border: var(--btn-border); border-radius: var(--btn-radius); box-shadow: var(--btn-shadow); padding: 4px 12px; text-decoration: none; cursor: pointer; }
  #muster-top a:hover, #muster-top button:hover { background: var(--btn-hover); }
  #colours { display: flex; gap: 6px; }
  #colours button { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 2px solid #f6ecd2; box-shadow: 0 0 0 1px #4a3018; }
  #colours button.on { border-color: #f6ecd2; box-shadow: 0 0 0 2px #f0c860, 0 0 0 3px #4a3018; }
  #troops, #card { background: var(--surface); border: var(--surface-border); border-radius: var(--surface-radius); box-shadow: var(--surface-shadow); color: var(--ink); z-index: 2; }
  #troops { position: fixed; top: 56px; left: 12px; bottom: 12px; width: 250px; overflow-y: auto; padding: 6px 8px 10px; scrollbar-width: thin; }
  #troops h4 { font: 400 13px var(--head-font); color: var(--gold); letter-spacing: .06em; margin: 12px 4px 4px; padding-bottom: 3px; border-bottom: 1px solid var(--rule); }
  #troops button { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 3px; box-shadow: none; color: var(--ink); padding: 5px 8px; cursor: pointer; font: 500 15px var(--body-font); }
  #troops button small { display: block; color: var(--dim); font-size: 12px; line-height: 1.3; }
  #troops button:hover { background: var(--hilite); }
  #troops button.on { background: var(--btn-on); color: var(--btn-on-ink); border: var(--btn-on-border); }
  #troops button.on small { color: #d9ceb0; }
  #card { position: fixed; right: 12px; bottom: 12px; width: min(340px, calc(100vw - 24px)); padding: 12px 14px; font: 15px/1.4 var(--body-font); }
  #card h3 { margin: 0 0 2px; color: var(--gold); font-size: 19px; }
  #card p { margin: 0 0 10px; color: var(--dim); }
  #card .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  #card .stats span { background: rgba(255, 250, 235, .45); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 6px; font-weight: 700; }
  #card .stats small { display: block; color: var(--dim); font-size: 11px; font-weight: 400; }
  #card .kit { display: flex; gap: 6px; margin-bottom: 10px; }
  #card .kit button { width: 38px; height: 34px; padding: 0; font-size: 18px; }
  #card .kit button .ico { filter: brightness(.5) saturate(1.6); }
  #card .kit button.on { background: var(--btn-on); color: var(--btn-on-ink); border: var(--btn-on-border); }
  #card .kit button.on .ico { filter: brightness(1.6); }
  #card .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  #card .acts button { padding: 5px 10px; font-size: 14px; }
  #menu-toggle { display: none; }
  @media (max-width: 700px) {
    #menu-toggle { display: inline-block; }
    #troops { display: none; top: auto; width: auto; right: 12px; max-height: 45vh; }
    body.list-open #troops { display: block; }
    body.list-open #card { display: none; }
    #muster-top .title { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="muster-top">
  <a href="index.html" title="Back to the menu">← Menu</a>
  <span class="title">Muster</span>
  <button id="menu-toggle" title="Show the list of troops">Troops</button>
  <span id="colours"></span>
  <button id="field" title="Frame the whole parade ground">Whole field</button>
</div>
<nav id="troops"></nav>
<div id="card" hidden></div>
<script type="module" src="src/checks.js"></script><!-- consistency checks: checks() in the console (HOW_WE_BUILD.md section 4) -->
<script type="module" src="src/muster.js"></script>
<script type="module" src="src/ui/tooltip.js"></script>
</body>
</html>
