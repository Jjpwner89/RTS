<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTS Muster</title>
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  body { overflow: hidden; }
  #muster-top { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; z-index: 3; }
  #muster-top > * { pointer-events: auto; }
  #muster-top a, #muster-top button { background: rgba(26, 22, 18, 0.82); color: #efe6d2; border: 1px solid rgba(224, 194, 122, 0.35); border-radius: 6px; padding: 6px 12px; font: 14px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  #muster-top .title { color: #ffd970; font: 600 18px system-ui, sans-serif; text-shadow: 0 1px 3px #000; margin-right: auto; }
  #colours { display: flex; gap: 6px; }
  #colours button { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); }
  #colours button.on { border-color: #ffd970; box-shadow: 0 0 0 2px rgba(255, 217, 112, 0.35); }
  #troops { position: fixed; top: 60px; left: 12px; bottom: 12px; width: 250px; overflow-y: auto; background: rgba(26, 22, 18, 0.82); border: 1px solid rgba(224, 194, 122, 0.35); border-radius: 8px; padding: 6px 8px 10px; z-index: 2; }
  #troops h4 { color: #ffd970; font: 600 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 4px 4px; }
  #troops button { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; color: #efe6d2; padding: 5px 8px; cursor: pointer; font: 14px system-ui, sans-serif; }
  #troops button small { display: block; color: #b8ab90; font-size: 11.5px; line-height: 1.3; }
  #troops button:hover { background: rgba(255, 255, 255, 0.06); }
  #troops button.on { border-color: #ffd970; background: rgba(255, 217, 112, 0.1); }
  #card { position: fixed; right: 12px; bottom: 12px; width: min(340px, calc(100vw - 24px)); background: rgba(26, 22, 18, 0.88); color: #efe6d2; border: 1px solid rgba(224, 194, 122, 0.35); border-radius: 8px; padding: 12px 14px; font: 14px/1.45 system-ui, sans-serif; z-index: 2; }
  #card h3 { margin: 0 0 2px; color: #ffd970; font-size: 18px; }
  #card p { margin: 0 0 10px; color: #b8ab90; }
  #card .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  #card .stats span { background: rgba(255, 255, 255, 0.05); border-radius: 5px; padding: 4px 6px; }
  #card .stats small { display: block; color: #b8ab90; font-size: 11px; }
  #card .kit { display: flex; gap: 6px; margin-bottom: 10px; }
  #card .kit button { width: 38px; height: 34px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(224, 194, 122, 0.25); border-radius: 6px; color: #efe6d2; cursor: pointer; font-size: 18px; }
  #card .kit button.on { border-color: #ffd970; background: rgba(255, 217, 112, 0.16); color: #ffd970; }
  #card .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  #card .acts button { background: rgba(255, 217, 112, 0.14); color: #efe6d2; border: 1px solid rgba(224, 194, 122, 0.45); border-radius: 6px; padding: 6px 10px; cursor: pointer; font: 13px system-ui, sans-serif; }
  #menu-toggle { display: none; }
  @media (max-width: 700px) {
    #menu-toggle { display: inline-block; }
    #troops { display: none; top: auto; width: auto; right: 12px; max-height: 45vh; }
    body.list-open #troops { display: block; }
    body.list-open #card { display: none; }
    #muster-top .title { font-size: 15px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="muster-top">
  <a href="index.html">← Menu</a>
  <span class="title">Muster</span>
  <button id="menu-toggle">Troops</button>
  <span id="colours"></span>
  <button id="field">Whole field</button>
</div>
<nav id="troops"></nav>
<div id="card" hidden></div>
<script type="module" src="src/muster.js"></script>
</body>
</html>
