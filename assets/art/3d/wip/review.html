<!doctype html><html><head><meta charset="utf-8"><title>Medieval clip review</title>
<style>
body{margin:0;background:#e3dfd1;font:14px system-ui;color:#292820;overflow:hidden}
header{height:52px;padding:0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0}select,button{padding:5px 8px;font:inherit}input[type=range]{width:220px}
#stage{position:relative}canvas{display:block}
.label{position:absolute;font-size:12px;font-weight:600;color:#4a473c;background:#e3dfd1cc;padding:2px 6px;pointer-events:none}
#info{position:absolute;left:16px;bottom:8px;font-size:12px;color:#5b5848}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<header><h1>Medieval clips</h1><select id="clip"></select><button id="play">Pause</button>
<select id="speed"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option></select>
<input id="time" type="range" min="0" max="1" step=".001"><span id="stamp"></span>
<select id="layout"><option value="four">Four views</option><option value="orbit">Orbit</option></select></header>
<div id="stage"></div><div id="info">Original Quaternius body and skeleton · 30 fps · props are simple guides</div>
<script type="module" src="./review.js"></script></body></html>
